<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-label="AgentGate workflow diagram">
  <rect width="1200" height="360" rx="24" fill="#f6f8fa"/>
  <text x="60" y="62" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="32" font-weight="800" fill="#1f2328">AgentGate pre-PR safety gate</text>
  <text x="60" y="100" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="17" fill="#57606a">Check AI-generated diffs before they become pull requests.</text>
  <g font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif">
    <g transform="translate(60 155)">
      <rect width="150" height="92" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="75" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2328">AI agent</text>
      <text x="75" y="64" text-anchor="middle" font-size="14" fill="#57606a">generates diff</text>
    </g>
    <text x="232" y="207" font-size="26" font-weight="800" fill="#1f883d">→</text>
    <g transform="translate(270 155)">
      <rect width="170" height="92" rx="12" fill="#dafbe1" stroke="#1f883d"/>
      <text x="85" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#0f5323">AgentGate</text>
      <text x="85" y="64" text-anchor="middle" font-size="14" fill="#0f5323">checks rules</text>
    </g>
    <text x="462" y="207" font-size="26" font-weight="800" fill="#1f883d">→</text>
    <g transform="translate(500 155)">
      <rect width="170" height="92" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="85" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2328">Human review</text>
      <text x="85" y="64" text-anchor="middle" font-size="14" fill="#57606a">reads report</text>
    </g>
    <text x="692" y="207" font-size="26" font-weight="800" fill="#1f883d">→</text>
    <g transform="translate(730 155)">
      <rect width="150" height="92" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="75" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2328">Tests</text>
      <text x="75" y="64" text-anchor="middle" font-size="14" fill="#57606a">prove change</text>
    </g>
    <text x="902" y="207" font-size="26" font-weight="800" fill="#1f883d">→</text>
    <g transform="translate(940 155)">
      <rect width="150" height="92" rx="12" fill="#ffffff" stroke="#d0d7de"/>
      <text x="75" y="40" text-anchor="middle" font-size="18" font-weight="800" fill="#1f2328">PR</text>
      <text x="75" y="64" text-anchor="middle" font-size="14" fill="#57606a">only if safe</text>
    </g>
  </g>
  <text x="60" y="315" font-family="-apple-system,BlinkMacSystemFont,Segoe UI,sans-serif" font-size="15" fill="#57606a">No secrets. No token reads. No external APIs. No auto-comments. No auto-PRs.</text>
</svg>
